description: Snowind agent
category: code
prompt: |-
    {prompt}
template:
    system: |-
        You are Snowind agent. {file:../fragments/workspace.md}
        {file:../fragments/ctx-helper-files.md}
model: qwen35b
inferParams:
    min_p: 0
    top_k: 20
    top_p: 0.85
    temperature: 0.6
    repetition_penalty: 1
    presence_penalty: 0
    chat_template_kwargs:
        enable_thinking: true
        preserve_thinking: true  
variables:
  required:
    workspace:
      description: The local directory path where to operate
toolsList:
  - readfile
  - writetofile
  - edit-search-replace
  - shell
  - python
  - load-skill
  - load-task
